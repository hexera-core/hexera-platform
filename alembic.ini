# Responsibility: Configure Alembic - where revisions live, how it reaches the database, and what it logs.
# Owns: the schema every operation is anchored to, so nothing depends on the connecting role's search_path.
# Boundaries: configuration only; the schema itself is declared by the revisions under alembic/versions/.

[alembic]
script_location = alembic
sqlalchemy.url = %(POSTGRES_DSN)s

# THE application schema, and the only declaration of it. Every Alembic operation - the version
# table, every table, index, constraint, enum, function and trigger in 0001..0006 - is anchored
# here by env.py, so nothing depends on the connecting role's `search_path`.
#
# `public` is the contract this repository has always had; naming it makes that explicit rather
# than implicit in whatever the role happens to resolve. Changing this value moves the whole
# installation, so it is a deployment decision, not a per-migration one.
version_table_schema = public

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
