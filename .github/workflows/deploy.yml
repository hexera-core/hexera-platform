# Responsibility: Ship what landed on main - Gate C on the merge commit, publish those exact images, then provision by digest.
# Owns: the pinned action digests, the federated identity each environment deploys as, and every deployment target it pins.
# Boundaries: it builds nothing of its own and touches no cloud resource directly; deploy/gcp/scripts/deploy.sh owns every mutation.

name: Deploy

# Same reason as CI's run-name: the Actions list is a wall of identical "Deploy" rows
# otherwise. `ref_name` is the branch on a push or a workflow_dispatch, and the tag itself
# on a `v*` release - which is exactly what you want to read on a prod run.
run-name: Deploy (${{ github.ref_name }})

# THE WHOLE CREDENTIAL STORY. GitHub mints a short-lived OIDC token (id-token: write), Google
# exchanges it for a short-lived access token through Workload Identity Federation, and the
# repository holds NO service-account key: there is nothing here to leak and nothing to rotate.
# `contents: read` is the checkout, and nothing beyond it - a deploy has no reason to write to
# the repository. Item 9 of the build-out plan blocks this item precisely because a JSON key in
# a GitHub secret was the alternative.
# Default: read only. The three jobs that talk to Google - release, provision and verify-admin -
# ask for id-token themselves, where the federated exchange actually happens; a workflow-wide
# id-token is a credential every job could mint, including the target picker.
permissions:
  contents: read

on:
  push:
    # dev auto-deploys on merge to main; prod is tag-triggered AND gated on the `prod`
    # environment's manual approval, so a tag alone never ships (platform-buildout-plan.md,
    # section 1 "Decision needed" and the Decisions section).
    branches: [main]
    tags: ["v*"]
  # THE ITERATION PATH. Push a branch to shared dev, repeatedly, before it is merged - which is
  # what a shared dev environment is FOR, and what this workflow could not do while its only
  # trigger was a merge that had already happened. Prod is deliberately absent: the `prod`
  # environment's deployment policy admits `v*` tags only, so a release still cannot be reached
  # from a branch, by anyone, however this workflow is invoked.
  workflow_dispatch:
    # ONE CHECKBOX PER TIER, every one defaulted OFF. There is no "all" shortcut and no preset
    # combination: deploying everything costs ticking every box, on purpose - the previous dropdown
    # let one click reconcile every tier including Cloud SQL and Memorystore, and a mis-click there
    # was indistinguishable from a deliberate choice. The roster matches deploy.sh's `_known` line
    # exactly (nine tiers today); the picker step below composes DEPLOY_COMPONENTS from whichever
    # of these came back 'true', in the same order `_known` lists them.
    inputs:
      images:
        description: "images - the mesh job and the API service (the two workloads that carry an application digest)"
        required: false
        default: false
        type: boolean
      data:
        description: "data - Cloud SQL and Memorystore"
        required: false
        default: false
        type: boolean
      storage:
        description: "storage - the artifacts bucket and its S3-interoperability credential"
        required: false
        default: false
        type: boolean
      migrate:
        description: "migrate - the schema, applied once before anything serves the new image"
        required: false
        default: false
        type: boolean
      queue:
        description: "queue - the queue-depth publisher and the autoscaling policy that reads it"
        required: false
        default: false
        type: boolean
      workers:
        description: "workers - the managed instance group, rolled onto the new template"
        required: false
        default: false
        type: boolean
      console:
        description: "console - the Cloud Run console service, in front of the API"
        required: false
        default: false
        type: boolean
      admin:
        description: "admin - the Cloud Run admin console, behind IAP (never publicly reachable)"
        required: false
        default: false
        type: boolean
      outreach:
        description: "outreach - the cold-outreach sender, as a scheduled job (CAN EMAIL REAL PEOPLE once both switches are on)"
        required: false
        default: false
        type: boolean
      edge:
        description: "edge - load balancer, reserved address and certificate for both consoles' hostnames"
        required: false
        default: false
        type: boolean
      console_env_prune:
        description: "console_env_prune - DROP live console settings this deploy no longer declares (needed once, to retire CONSOLE_AUTH_USERS)"
        required: false
        default: false
        type: boolean

# A deploy MUTATES a cloud project through an 18-stage provisioner. Cancelling one mid-flight
# leaves the project half-reconciled - the stages are individually idempotent, the sequence is
# not resumable from an arbitrary point - so runs QUEUE behind each other instead of replacing
# each other. This is deliberately the opposite of ci.yml, where cancelling a superseded run of
# a read-only gate costs nothing.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Which environment this ref deploys to, and every target that environment is pinned to.
  # Split out from the deploy job so the answer is computed ONCE and the deploy job can name the
  # GitHub environment it runs under - which is what applies the environment's protection rules.
  target:
    name: Resolve the deployment target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      deployment_id: ${{ steps.pick.outputs.deployment_id }}
      project: ${{ steps.pick.outputs.project }}
      region: ${{ steps.pick.outputs.region }}
      mesh_job: ${{ steps.pick.outputs.mesh_job }}
      mesh_bucket: ${{ steps.pick.outputs.mesh_bucket }}
      ar_repository: ${{ steps.pick.outputs.ar_repository }}
      registry: ${{ steps.pick.outputs.registry }}
      wif_provider: ${{ steps.pick.outputs.wif_provider }}
      deployer_sa: ${{ steps.pick.outputs.deployer_sa }}
      # WHICH TIERS THIS RUN RECONCILES. deploy.sh reads DEPLOY_COMPONENTS and states every stage
      # it skips; `all` is the only value that means "everything", so an unset or mistyped one can
      # never quietly deploy less than was asked for.
      components: ${{ steps.pick.outputs.components }}
      # Every workload beyond the mesh executor, named the same way in both environments:
      # <deployment-id>-<role>. The project is already called hexera-dev / hexera-prod, so a
      # `hexera-dev-` prefix INSIDE it says the same word twice; the hand-made resources that
      # carried one are what made two conventions look like two systems.
      api_service: ${{ steps.pick.outputs.api_service }}
      # The console, in both environments now. Prod stayed empty only while hexera-prod had no
      # `prod-console` service account and no secret container it could read - see the reasoning
      # where prod's pick branch sets it below. Both now exist, so this output is what tells
      # create-console-service.sh to reconcile hexera-prod's console the same way dev's has been
      # reconciled since Task 8/12.
      console_service: ${{ steps.pick.outputs.console_service }}
      # The admin console, in both environments now - same reasoning as console_service
      # immediately above: an allUsers-invokable service is fine for the console, whose sign-in
      # page must be reachable before anyone can authenticate, but the admin console's ONLY gate
      # is IAP, so this output exists to name the Cloud Run service that gate is applied to, never
      # to make it public.
      admin_service: ${{ steps.pick.outputs.admin_service }}
      # The custom hostnames the edge (Task 4) fronts, in both environments now - same reasoning
      # as console_service/admin_service above: the prerequisites an owner had to supply by hand
      # (the service accounts above, and the secret containers each one reads) now exist in
      # hexera-prod, so a release tag provisioning the load balancer, address and certificate for
      # these hostnames is provisioning something a human asked for, not a surprise. The IAP OAuth
      # brand for hexera-prod and the DNS records for these two hostnames are still outstanding -
      # see docs/deployment/console-domains.md.
      console_domain: ${{ steps.pick.outputs.console_domain }}
      admin_domain: ${{ steps.pick.outputs.admin_domain }}
      billing_export_table: ${{ steps.pick.outputs.billing_export_table }}
      worker_env_uri: ${{ steps.pick.outputs.worker_env_uri }}
      outreach_enabled: ${{ steps.pick.outputs.outreach_enabled }}
      outreach_worker_job: ${{ steps.pick.outputs.outreach_worker_job }}
      outreach_db_host: ${{ steps.pick.outputs.outreach_db_host }}
      outreach_db_name: ${{ steps.pick.outputs.outreach_db_name }}
      outreach_db_user: ${{ steps.pick.outputs.outreach_db_user }}
      outreach_cloudsql_instance: ${{ steps.pick.outputs.outreach_cloudsql_instance }}
      outreach_db_password_secret: ${{ steps.pick.outputs.outreach_db_password_secret }}
      outreach_kms_key: ${{ steps.pick.outputs.outreach_kms_key }}
      google_client_id: ${{ steps.pick.outputs.google_client_id }}
      google_client_secret_secret: ${{ steps.pick.outputs.google_client_secret_secret }}
      google_redirect_uri: ${{ steps.pick.outputs.google_redirect_uri }}
      # THE RUNTIME HARDENING SWITCH AND THE BROWSER ORIGIN IT ADMITS, pinned per environment for
      # the same reason every target above is: they have to reach create-api-service.sh, and the
      # only path that reaches it is this one. bootstrap-env.sh REGENERATES the deployment env on
      # stage 1 of every run, so a value written into that file by any other means is erased before
      # stage 2 validates it - which is exactly what happened to a hand-set APP_ENV=prod, leaving
      # prod both unhardened and undeployable. Emitted here, exported into the deploy job's env
      # below, and preserved by bootstrap-env.sh's `${APP_ENV:-dev}` idiom.
      app_env: ${{ steps.pick.outputs.app_env }}
      api_cors_origins: ${{ steps.pick.outputs.api_cors_origins }}
      cloudsql_instance: ${{ steps.pick.outputs.cloudsql_instance }}
      redis_instance: ${{ steps.pick.outputs.redis_instance }}
      migrate_db_name: ${{ steps.pick.outputs.migrate_db_name }}
      migrate_db_user: ${{ steps.pick.outputs.migrate_db_user }}
      postgres_password_secret: ${{ steps.pick.outputs.postgres_password_secret }}
      worker_mig: ${{ steps.pick.outputs.worker_mig }}
      worker_mig_zone: ${{ steps.pick.outputs.worker_mig_zone }}
      # THE OBJECT STORE. Only the release-tag branch emits these; a dev run leaves all three
      # empty, which is what dev has always had - validate-config.sh's object-store rule fires
      # only when the store is partly stated, so all-empty is skipped rather than refused.
      minio_access_key: ${{ steps.pick.outputs.minio_access_key }}
      minio_bucket: ${{ steps.pick.outputs.minio_bucket }}
      minio_secret_key_secret: ${{ steps.pick.outputs.minio_secret_key_secret }}
      # NOT pinned, and deliberately: MIGRATE_DB_HOST and REDIS_URL are ADDRESSES, allocated by
      # Google when the instances above are created. create-data-tier.sh resolves them from the
      # live instances and writes them back into the deployment env for the stages that consume
      # them. A literal here is a value that is right until the instance is ever replaced - the
      # 10.66.0.3 that used to live in this file belonged to an instance that no longer exists.
    steps:
      - id: pick
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # Boolean workflow_dispatch inputs arrive as the strings 'true' / 'false' (unset, on any
          # other trigger, where github.event.inputs is empty).
          DISPATCH_IMAGES: ${{ github.event.inputs.images }}
          DISPATCH_DATA: ${{ github.event.inputs.data }}
          DISPATCH_STORAGE: ${{ github.event.inputs.storage }}
          DISPATCH_MIGRATE: ${{ github.event.inputs.migrate }}
          DISPATCH_QUEUE: ${{ github.event.inputs.queue }}
          DISPATCH_WORKERS: ${{ github.event.inputs.workers }}
          DISPATCH_CONSOLE: ${{ github.event.inputs.console }}
          DISPATCH_ADMIN: ${{ github.event.inputs.admin }}
          DISPATCH_OUTREACH: ${{ github.event.inputs.outreach }}
          DISPATCH_EDGE: ${{ github.event.inputs.edge }}
        # Every target is a LITERAL here rather than a repository variable. deploy.sh under
        # DEPLOY_NONINTERACTIVE=1 refuses to mutate a project on ambient configuration, and a
        # value editable in the GitHub settings UI without a review IS ambient configuration -
        # it just lives somewhere else. Reviewing a deploy target then means reviewing a diff.
        run: |
          set -euo pipefail
          # A manual run and a merge both target dev; they differ only in HOW MUCH they reconcile.
          # A merge to main takes the cheap path - the two workloads that carry an application
          # digest, the schema they may need, and the console that fronts them - because
          # reconciling Cloud SQL, the object-store credential and the whole worker fleet to ship
          # an image costs minutes and money for tiers the change did not touch. A manual dispatch
          # instead composes DEPLOY_COMPONENTS from whichever checkboxes were ticked; ticking every
          # one of them is what a manual run has to do to reconcile everything, and every release
          # tag does exactly that, unconditionally, below.
          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              # Composed in the same order deploy.sh's `_known` line lists them, so the deploy log
              # reads predictably no matter which boxes were ticked. Every checkbox defaults to
              # false, so nothing is selected implicitly - there is deliberately no 'all' shortcut.
              _selected=""
              [ "${DISPATCH_IMAGES:-false}" = "true" ] && _selected="${_selected}images,"
              [ "${DISPATCH_DATA:-false}" = "true" ] && _selected="${_selected}data,"
              [ "${DISPATCH_STORAGE:-false}" = "true" ] && _selected="${_selected}storage,"
              [ "${DISPATCH_MIGRATE:-false}" = "true" ] && _selected="${_selected}migrate,"
              [ "${DISPATCH_QUEUE:-false}" = "true" ] && _selected="${_selected}queue,"
              [ "${DISPATCH_WORKERS:-false}" = "true" ] && _selected="${_selected}workers,"
              [ "${DISPATCH_CONSOLE:-false}" = "true" ] && _selected="${_selected}console,"
              [ "${DISPATCH_ADMIN:-false}" = "true" ] && _selected="${_selected}admin,"
              [ "${DISPATCH_OUTREACH:-false}" = "true" ] && _selected="${_selected}outreach,"
              [ "${DISPATCH_EDGE:-false}" = "true" ] && _selected="${_selected}edge,"
              _selected="${_selected%,}"
              # DEPLOYING NOTHING IS A MISTAKE, NOT A VALID REQUEST - fail loudly rather than let an
              # empty selection reach $GITHUB_OUTPUT. An empty `components=` output would still set
              # DEPLOY_COMPONENTS in the deploy job's environment (to the empty string, not unset),
              # and deploy.sh's own default (`DEPLOY_COMPONENTS:-all`) treats an empty variable the
              # same as an unset one - so silently letting this through would deploy EVERYTHING,
              # the exact opposite of "nothing ticked", and a run that mutates nothing was never the
              # risk here; a run that mutates everything by accident was.
              if [ -z "${_selected}" ]; then
                echo "::error::no component checkbox was ticked - deploying nothing is not a valid request. Available checkboxes: images, data, storage, migrate, queue, workers, console, admin, outreach, edge. Tick every one of them to deploy everything."
                exit 1
              fi
            fi
            {
              if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
                echo "components=${_selected}"
              else
                echo "components=images,migrate,console,admin"
              fi
              echo "environment=dev"
              echo "deployment_id=dev"
              echo "project=hexera-dev"
              echo "region=us-central1"
              echo "mesh_job=dev-mesh"
              echo "mesh_bucket=dev-exchange-224734058693"
              echo "ar_repository=mesh"
              echo "registry=us-central1-docker.pkg.dev/hexera-dev/mesh"
              echo "wif_provider=projects/224734058693/locations/global/workloadIdentityPools/github-actions/providers/github"
              echo "deployer_sa=github-deployer@hexera-dev.iam.gserviceaccount.com"
              # The API service. Until this was pinned the deploy provisioned every tier EXCEPT
              # the one users reach: hexera-dev-api was created by hand, ran an image no release
              # record named, and no workflow could roll it forward.
              echo "api_service=dev-api"
              # The console, PINNED, for the same reason api_service is: `components=console` has
              # been selectable since Task 11 and dev's manifest and provisioning script have
              # named `dev-console` since Task 8/12, but nothing before this line ever told the
              # deploy job to look for it - so the console stage ran on every dev deploy and
              # stated its own skip. Pinning it here is what makes "a merge to main reconciles the
              # console" actually true in dev, matching the api_service precedent above.
              echo "console_service=dev-console"
              # The admin console, PINNED, dev only - same reasoning as console_service above.
              # create-admin-service.sh and dev's deployment-state manifest have named
              # `dev-admin` since Task 6/7; this line is what tells the deploy job to look for it.
              echo "admin_service=dev-admin"
              # THE BILLING EXPORT. Configured per BILLING ACCOUNT, not per project: hexera-dev and
              # hexera-prod share one account, so this single table carries BOTH projects' usage
              # and the console's query filters on project.id to keep them apart.
              #
              # THE DATASET LIVES IN hexera-prod, and that is the one thing about this worth
              # arguing over. A billing export accumulates from the day it is enabled and CANNOT be
              # backfilled, which makes its history irreplaceable; hexera-dev is a shared sandbox
              # that may be torn down and rebuilt, and losing the table with it would lose every
              # month recorded up to that point. Durability wins.
              #
              # The cost is that dev's console reads a table in prod - a cross-project read the
              # admin console design (Decision 4) otherwise avoids. It is accepted HERE and nowhere
              # else, because the exposure is already granted: dev's identity holds
              # roles/billing.viewer on the shared billing ACCOUNT, so it can already see
              # account-wide billing data. The BigQuery grant is dataset-scoped READER on this one
              # table and adds nothing it could not already reach.
              # NAMED AS A DATASET, NOT A TABLE. The console finds the Standard usage cost table
              # inside it. The table name is derived from the billing account id, and a derived
              # name that is wrong fails identically to an export that is switched off - "Not
              # found: Table" - so the mistake would be indistinguishable from the state it is
              # waiting on. An exact project.dataset.table is still accepted if one is ever needed.
              echo "billing_export_table=hexera-prod.billing_export"
              # The custom hostnames, PINNED, dev only - same reasoning as console_service and
              # admin_service immediately above. create-edge.sh (Task 4) only provisions the load
              # balancer, address and certificate when it is handed a domain; this is what hands
              # it one for dev.
              echo "console_domain=dev.console.hexera.ai"
              echo "admin_domain=dev.admin.hexera.ai"
              # DEV IS UNCHANGED BY BEING STATED. Both values below are create-api-service.sh's
              # own defaults, which is what dev has been getting all along while nothing named
              # them; pinning them here makes dev's configuration visible in the same diff prod's
              # is, without altering a single byte of what the API service receives. `dev` is in
              # settings/policy.py's exempt set on purpose - a shared dev environment is not
              # asked to enforce MESH_API_KEY - and `*` is the origin list that goes with it.
              echo "app_env=dev"
              echo "api_cors_origins=*"
              # Cloud SQL and Memorystore, by NAME. Their private addresses are resolved from the
              # instances themselves - see the outputs block above.
              #
              # NOT dev-pg / dev-redis, for exactly the reason prod's branch below is not
              # prod-pg / prod-redis - dev was simply missed when that was corrected. Both
              # instances are STATEFUL and already exist under the older naming: hexera-dev-pg
              # holds the meshpipeline database this environment's migrations run against.
              # Neither can be renamed in place and deploy.sh reconciles BY EXACT NAME, so the
              # tidier name would not rename anything - it would build a SECOND, billed instance
              # beside the live one on the next `components=all`, and leave every migration
              # pointing at an empty database. Renaming them is a data migration, not a config
              # edit, and it is tracked as its own decision.
              #
              # This was not merely latent: discovery reported "no hosted database declared" on
              # every dev deploy, because it was resolving a name nothing answers to.
              echo "cloudsql_instance=hexera-dev-pg"
              echo "redis_instance=hexera-dev-redis"
              echo "migrate_db_name=meshpipeline"
              echo "migrate_db_user=meshpipeline"
              # A Secret Manager CONTAINER NAME. No credential value appears in this file.
              echo "postgres_password_secret=postgres-password"
              # The fleet the published queue depth scales.
              # THE FLEET'S NAME, and the convention prod already follows with `prod-workers`.
              # A managed instance group cannot be renamed, so moving to this name meant creating
              # the group and retiring the hand-made `hexera-dev-workers` that predated the fleet
              # having a provisioning script.
              echo "worker_mig=dev-workers"
              echo "worker_mig_zone=us-central1-a"
              # THE WORKER'S NON-SECRET SETTINGS, as a GCS object the instance fetches at startup.
              # create-worker-fleet.sh requires it, which is why the workers tier could never run
              # from CI before this line existed - and why the fleet in this project was built by
              # hand. It carries policy, model routing and limits, never a credential: the object
              # and instance metadata are both readable by anyone who can describe the instance.
              echo "worker_env_uri=gs://dev-transfer-224734058693/worker.env"
              # Dev runs no outreach - see the prod block. Empty, so the stage states its skip.
              echo "outreach_enabled="
              echo "outreach_worker_job="
              # Empty with it, for the same reason: naming a database or an OAuth client here would
              # stand a second mailbox connection up beside the real one.
              echo "outreach_db_host="
              echo "outreach_db_name="
              echo "outreach_db_user="
              echo "outreach_cloudsql_instance="
              echo "outreach_db_password_secret="
              echo "outreach_kms_key="
              echo "google_client_id="
              echo "google_client_secret_secret="
              echo "google_redirect_uri="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A release tag. hexera-prod is stood up ON THE FIRST RELEASE and not before
          # (platform-buildout-plan.md, Decisions 1). The project today has no workload identity
          # pool, no deployer identity, no Artifact Registry repository and no mesh job, so a run
          # here would not be a deploy - it would be a first provisioning run under an identity
          # that does not exist. The target is STATED so the shape is reviewable, and refuses
          # until prod is stood up. What ENFORCES that is the `prod` GitHub environment: it carries
          # a required-reviewers rule and a deployment branch policy restricted to v* tags, so a run
          # reaching this point waits for a human before it touches anything. The repository
          # variable that used to stand in for approval is gone - an org admin could flip it
          # unreviewed, which is not an approval gate (platform-buildout-plan.md, Decided
          # 2026-08-31).
          {
            # A RELEASE RECONCILES EVERYTHING. A tag is the one moment the deployed environment
            # should be provably the whole of what the repository describes, so the cheap path is
            # not offered here and the dispatch input cannot reach it.
            echo "components=all"
            echo "environment=prod"
            echo "deployment_id=prod"
            echo "project=hexera-prod"
            echo "region=us-central1"
            echo "mesh_job=prod-mesh"
            echo "mesh_bucket=prod-exchange-688073002171"
            echo "ar_repository=mesh"
            echo "registry=us-central1-docker.pkg.dev/hexera-prod/mesh"
            echo "wif_provider=projects/688073002171/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "deployer_sa=github-deployer@hexera-prod.iam.gserviceaccount.com"
            # The same shape as dev, one prefix apart, because an environment that differs from
            # the one it is validated against is an environment nothing validated. These were
            # blank while hexera-prod had no data tier and the deploy identity could not create
            # one; it can now, so the first release provisions what it names.
            echo "api_service=prod-api"
            # THE CONSOLE, NOW PINNED. `components=all` a few lines up means a release tag
            # reconciles every tier it is told about, and this line is what tells it to reconcile
            # the console. It stayed empty until the prerequisites an owner had to supply by hand
            # existed: `prod-console` is now a real service account in hexera-prod, and it holds
            # `secretmanager.secretAccessor` on the four secret containers (console-auth-secret,
            # console-auth-users, mesh-api-key, user-token-secret), each with an enabled version.
            # A name typed here before those existed would have been the same class of mistake
            # PR #12's naming slip nearly made below - a second, unwanted, paid resource standing
            # next to the real one - so it waited for a reviewed diff stating the prerequisites
            # were actually met. This is that diff.
            echo "console_service=prod-console"
            # THE ADMIN CONSOLE, NOW PINNED - the same reasoning as console_service immediately
            # above: `prod-admin` is now a real service account in hexera-prod with the same
            # secret access. `components=all` means this line is what tells the release to
            # reconcile it. What is NOT yet true: the IAP OAuth brand for hexera-prod, which has
            # to be created by hand in the Cloud Console (Google shut down the IAP OAuth Admin
            # APIs in March 2026, so it cannot be scripted). Until that brand exists, `--iap` on
            # this service will not work - see docs/deployment/console-domains.md.
            echo "admin_service=prod-admin"
            # The same table the dev block names, and for prod it is not even a cross-project
            # read - the dataset lives here.
            echo "billing_export_table=hexera-prod.billing_export"
            # THE CUSTOM HOSTNAMES, NOW PINNED - the same reasoning as console_service and
            # admin_service immediately above: naming them here is what lets create-edge.sh
            # provision the load balancer, reserved global address and managed certificate these
            # two services front. What is NOT yet true: the DNS A records for these hostnames do
            # not exist, so the certificate this run provisions will report PROVISIONING until an
            # operator points DNS at the address this run prints - see
            # docs/deployment/console-domains.md.
            echo "console_domain=console.hexera.ai"
            echo "admin_domain=admin.hexera.ai"
            # THE HARDENING PROD ACTUALLY DEPLOYS UNDER, and the only place that delivers it.
            # settings/policy.py exempts {dev, development, local, test, testing, ci} from every
            # guard it has, so any of those names here is an API that enforces neither MESH_API_KEY
            # nor USER_TOKEN_SECRET and accepts whatever X-User-Id a caller sends - its own comment
            # calls that IDOR. `prod` is outside that set, which is what validate-config.sh's
            # DEPLOYMENT_ID=prod check demands before it will let the deploy past stage 2.
            #
            # The CORS list narrows with it: create-api-service.sh defaults to `*`, and a hardened
            # runtime refuses to start under a wildcard origin, so leaving the default here would
            # fail the release for a second, unrelated-looking reason. console.hexera.ai is the one
            # browser origin this API is meant to serve - the same hostname console_domain names
            # two lines up, so the edge and the API agree on what the front door is.
            echo "app_env=prod"
            echo "api_cors_origins=https://console.hexera.ai"
            # NOT prod-pg / prod-redis. These two are STATEFUL and already exist under the older
            # naming - hexera-prod-pg has backups, point-in-time recovery, deletion protection and
            # no public IP, and it holds the meshpipeline database. Cloud SQL and Memorystore
            # cannot be renamed in place, and deploy.sh reconciles BY EXACT NAME, so pinning the
            # tidier name here would not rename anything: it would build a SECOND database beside
            # the live one on the next release tag. Renaming them is a data migration, not a
            # config edit, and it is tracked as its own decision.
            echo "cloudsql_instance=hexera-prod-pg"
            echo "redis_instance=hexera-prod-redis"
            echo "migrate_db_name=meshpipeline"
            echo "migrate_db_user=meshpipeline"
            echo "postgres_password_secret=postgres-password"
            echo "worker_mig=prod-workers"
            echo "worker_mig_zone=us-central1-a"
            echo "worker_env_uri=gs://prod-artifacts-688073002171/deploy/worker.env"
            # OUTREACH IS PROD-ONLY: one partner list, one mailbox. Named here and nowhere else.
            echo "outreach_enabled=1"
            echo "outreach_worker_job=prod-outreach"
            # THE OUTREACH DATABASE. The `outreach` schema lives INSIDE meshpipeline - alembic
            # revision 0005 creates it there - so this is the same Cloud SQL instance and the same
            # database the rest of the platform migrates, reached over the Cloud Run socket.
            # OUTREACH_DB_HOST doubles as that socket path.
            #
            # THE ROLE IS meshpipeline, AND THAT IS A DELIBERATE COMPROMISE, not an oversight. A
            # dedicated `outreach` role restricted to its own schema is the right shape and is
            # tracked as a follow-up; what blocks it today is that hexera-prod-pg has no public IP,
            # so there is no path from a laptop or from CI on which to run the CREATE ROLE and the
            # GRANTs. Standing one up needs either the Cloud SQL proxy in the deploy job or a
            # grant step in the migrate job, and neither is a config edit. Until then the outreach
            # code runs with the same rights as the rest of the platform, which is the same trust
            # boundary every other service in this project already sits inside.
            echo "outreach_db_host=/cloudsql/hexera-prod:us-central1:hexera-prod-pg"
            echo "outreach_db_name=meshpipeline"
            echo "outreach_db_user=meshpipeline"
            echo "outreach_cloudsql_instance=hexera-prod:us-central1:hexera-prod-pg"
            echo "outreach_db_password_secret=postgres-password"
            # The key the mailbox refresh token is sealed with. create-admin-service.sh provisions
            # the keyring and key this names and grants the admin identity encrypt/decrypt on it -
            # never admin, so the console cannot destroy the key its own stored tokens depend on.
            echo "outreach_kms_key=projects/hexera-prod/locations/us-central1/keyRings/outreach/cryptoKeys/oauth-tokens"
            # THE OAUTH CLIENT. The id is the PUBLIC half and ships as a plain environment value;
            # the secret half is a Secret Manager CONTAINER NAME and its value never appears here.
            # The web application client was created on 2026-09-10 carrying the redirect URI
            # below; its secret half lives in Secret Manager as google-client-secret. Google shut
            # down the OAuth client admin APIs, so neither the client nor a replacement redirect
            # URI can be scripted - changing either is a Cloud Console action plus a diff here.
            echo "google_client_id=688073002171-8ouamu2ff8a13s7c1p5hcu1lvtvhqf1q.apps.googleusercontent.com"
            echo "google_client_secret_secret=google-client-secret"
            # Must match the authorised redirect URI on that client EXACTLY, including the scheme
            # and the absence of a trailing slash. admin_domain above is the same hostname.
            echo "google_redirect_uri=https://admin.hexera.ai/outreach/auth/callback"
            # THE OBJECT-STORE KEY THIS DEPLOYMENT ALREADY OWNS, and the only thing that stops a
            # release tag minting a second one. create-object-storage.sh decides "reuse or mint"
            # by testing the RECORDED access id against the live ACTIVE keys; the recording lives
            # in the deployment env, and bootstrap-env.sh regenerates that file on stage 1 of
            # every run from the ambient environment (`MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}`).
            # On a fresh runner nothing sets it, so the test compared against the empty string,
            # concluded no usable key existed, and tried to mint - which a deploy identity is
            # deliberately refused (storage.hmacKeyAdmin is an owner's role). That is what failed
            # the v0.1.1 release at stage 8, with the ACTIVE key and its secret both sitting
            # right there. Pinned here for the same reason app_env is: this is the only route by
            # which a value survives stage 1 and reaches the stage that reads it.
            #
            # THE ACCESS ID IS NOT A CREDENTIAL. It is the public half of the pair - the settings
            # catalogue marks only MINIO_SECRET_KEY secret, the value ships as a plain env var on
            # the running service, and create-object-storage.sh writes it into the deployment env
            # in the clear on purpose. The secret half is a Secret Manager CONTAINER NAME below;
            # no secret value appears in this file or in any log this workflow produces.
            #
            # ROTATION IS A DIFF. Minting a replacement is an owner's one-off act, and the new id
            # has to be typed here for the next release to reuse it - which is the same reviewed
            # -diff property every other target on this branch has, not an oversight.
            echo "minio_access_key=GOOG1EEQGTX5DEAFEWZSHMYJ23F4MUA2MSOC4UH7I7YWOSBUWPLYOL7XL3UYN"
            # The other two exist to satisfy validate-config.sh, which runs at stage 2 - six
            # stages before the object store is discovered - and refuses a HALF-STATED store: an
            # access id with no bucket and no secret container is a configuration that would fail
            # at the first upload instead of here. Both restate what is already true rather than
            # selecting anything: create-object-storage.sh derives the bucket from
            # DEPLOYMENT_ID + the project number, and defaults the container to minio-secret-key.
            echo "minio_bucket=prod-artifacts-688073002171"
            echo "minio_secret_key_secret=minio-secret-key"
          } >> "$GITHUB_OUTPUT"

  # THE MISSING HALF OF "CI/CD". Until this existed, ci.yml and deploy.yml both triggered on a
  # push to main and raced: a red CI could not stop a deploy, because nothing connected them. The
  # deploy runs its own release-artifact validation, which is the heaviest gate in the repository,
  # but it is not a superset - ruff, the mypy ratchet, CodeQL, the dependency audit and the
  # repository contracts run only in ci.yml, and every one of them could have been failing while a
  # deploy shipped.
  #
  # This waits for the `hexera/ci-gate` CHECK RUN on THIS COMMIT rather than for a workflow run,
  # so it is indifferent to whether CI ran on the push, on the pull request that merged it, or on
  # a manual dispatch of the same SHA. ci-gate is `if: !cancelled()`, so it reports for every
  # change including a documentation-only one.
  #
  # IT IS NOT REDUNDANT WITH BRANCH PROTECTION, which was the original justification here and was
  # simply wrong. Checked 2026-09-04: the `main` ruleset carries creation/update/deletion and
  # non-fast-forward rules only - no `required_status_checks` rule and no `pull_request` rule - so
  # nothing on the repository side stops a red commit reaching main. Until that changes this job
  # is the ONLY thing standing between a failing suite and a deployed artifact.
  #
  # A TAG THAT NAMES A COMMIT CI NEVER SAW WILL TIME OUT HERE, and that is the intended outcome:
  # ci.yml runs on pushes to main, not on tags, so a release tag is expected to point at a commit
  # main already validated. Tagging something else is the case this refuses to ship.
  await-ci:
    name: Wait for CI on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    outputs:
      # false means "stand down quietly", which is NOT the same as failing. See the superseded
      # branch below; the deploy job consults this rather than merely depending on the job.
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - id: gate
        name: Require hexera/ci-gate to have passed for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # ADVISORY FOR A MANUAL DEV RUN, BLOCKING EVERYWHERE ELSE. Pushing a branch to shared dev
          # is what the environment is for, and a branch with no open pull request has no ci-gate
          # at all - so requiring one would make the iteration path depend on remembering to run
          # CI first. The artifact is still validated either way: this job gates the RELEASE
          # RECORD, and release-validate builds and tests the exact images before any of them are
          # published. What is given up is ruff, mypy, CodeQL and the dependency audit, on a
          # sandbox, at the request of a person who typed the branch name.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "manual dev deploy - CI is reported, not required"
            read -r _t _ok _bad _c _p <<<"$(
              gh api "repos/${REPO}/commits/${SHA}/check-runs?per_page=100" \
                --jq '[.check_runs[] | select(.name == "hexera/ci-gate")]
                      | "\(length) \([.[] | select(.conclusion == "success")] | length) \([.[] | select(.status == "completed" and .conclusion != "success")] | length) 0 \([.[] | select(.status != "completed")] | length)"' 2>/dev/null || echo "0 0 0 0 0"
            )"
            if [ "${_t}" -eq 0 ]; then
              echo "::warning::no hexera/ci-gate has run for ${SHA}. Deploying to dev anyway; open a pull request to get one."
            elif [ "${_bad}" -gt 0 ]; then
              echo "::warning::hexera/ci-gate did NOT pass for ${SHA} (${_bad} of ${_t}). Deploying to dev anyway - this is a sandbox, but do not tag this commit."
            elif [ "${_p}" -gt 0 ]; then
              echo "::warning::hexera/ci-gate is still running for ${SHA}. Deploying to dev without waiting."
            else
              echo "hexera/ci-gate passed for ${SHA}"
            fi
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Polled rather than awaited, because the check may not have been CREATED yet: on a push
          # to main both workflows start together and this job can reach the API first. "Not there"
          # and "not finished" are therefore the same state - keep waiting - and only a concluded
          # check is a verdict.
          deadline=$(( SECONDS + 40 * 60 ))
          while :; do
            # EVERY ci-gate run for this commit must have concluded, and all of them must have
            # passed. Reading only the latest was wrong: a manual workflow_dispatch of the same
            # SHA starts a SECOND ci-gate, and if it finished first its success would release the
            # deploy while the push's own run was still going - and might still fail. So a
            # still-running sibling keeps this waiting, and one failed sibling fails the deploy.
            read -r total done_ok failed cancelled pending <<<"$(
              gh api "repos/${REPO}/commits/${SHA}/check-runs?per_page=100" \
                --jq '[.check_runs[] | select(.name == "hexera/ci-gate")]
                      | "\(length) \([.[] | select(.status == "completed" and .conclusion == "success")] | length) \([.[] | select(.status == "completed" and .conclusion != "success")] | length) \([.[] | select(.status == "completed" and .conclusion == "cancelled")] | length) \([.[] | select(.status != "completed")] | length)"' 2>/dev/null || echo "0 0 0 0 0"
            )"
            if [ "${failed}" -gt 0 ]; then
              # CANCELLED IS NOT REJECTED, and conflating them cost a red deploy on the very first
              # merge this gate ran on. ci.yml cancels a superseded run of itself (concurrency,
              # cancel-in-progress on main), so two merges landing a minute apart leave the FIRST
              # commit's ci-gate cancelled - no verdict, not a bad one. Failing there reports a
              # rejection that never happened, on a commit that is already history, while the
              # newer commit's deploy is queued behind it and about to do the same work.
              #
              # So a cancellation is only a problem if nothing newer is coming. If this commit is
              # no longer the branch head, the deploy stands down and says so; if it IS the head,
              # the commit genuinely has no verdict and that is a hard stop.
              if [ "${cancelled}" -eq "${failed}" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
                head="$(gh api "repos/${REPO}/commits/main" --jq '.sha' 2>/dev/null || echo "")"
                if [ -n "${head}" ] && [ "${head}" != "${SHA}" ]; then
                  echo "hexera/ci-gate was CANCELLED for ${SHA}, which is no longer the head of main (${head:0:7})."
                  echo "Superseded - standing down. The deploy for ${head:0:7} covers this."
                  echo "proceed=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
              echo "::error::${failed} of ${total} hexera/ci-gate runs for ${SHA} did not pass (${cancelled} cancelled). Nothing is deployed from a commit CI did not clear."
              exit 1
            fi
            if [ "${total}" -gt 0 ] && [ "${pending}" -eq 0 ] && [ "${done_ok}" -eq "${total}" ]; then
              echo "all ${total} hexera/ci-gate run(s) passed for ${SHA} - proceeding"
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::hexera/ci-gate did not conclude for ${SHA} within 40 minutes (${done_ok} passed, ${pending} still running, of ${total})."
              echo "If this is a release tag, it names a commit CI never validated - tag a commit from main instead."
              exit 1
            fi
            echo "  hexera/ci-gate: ${done_ok} passed, ${pending} running, of ${total} - waiting"
            sleep 30
          done

  # WHY THE DEPLOY IS SIX JOBS AND NOT ONE. It used to be one - checkout, toolchain, auth, Gate C,
  # the push, deploy.sh, two post-deploy verifications and the records upload, in a single
  # 300-minute lane. That shape cost three things. A red X said "the deploy failed" without saying whether it
  # failed BUILDING, PUBLISHING, PROVISIONING or VERIFYING, which are four different pages and
  # four different people. Re-running it re-ran ALL of it, so a flaky post-deploy curl rebuilt the
  # mesh image. And the two verifications at the end - one an unauthenticated curl, the other a
  # gcloud IAM read - are wholly independent of each other and ran back to back for no reason.
  #
  # THE DEPENDENCIES BELOW ARE THE REAL ONES, not the order somebody typed the steps in:
  #
  #   target ───┐                          ┌─ edge-dns ───────┐
  #             ├─ release ─── provision ──┼─ verify-console ─┼─ deploy-gate
  #   await-ci ─┘                          └─ verify-admin ───┘
  #
  #   target    -> release      the registry to push to, and the project to authenticate against
  #   await-ci  -> release      nothing this commit produced is published until CI cleared it
  #   release   -> provision    deploy.sh promotes DIGESTS out of deploy/output/release.json; it
  #                             does not build, so the record is the whole of what it needs
  #   provision -> the three    each consumes a URL or address deploy.sh discovered, and nothing
  #                             else - so they run at the same time as each other
  #
  # WHAT IS DELIBERATELY *NOT* SPLIT: release-validate and release-publish. publish pushes THE
  # EXACT IMAGE OBJECTS validate built - never a rebuild, which is the property the whole gate
  # exists for - and images do not survive a job boundary without a multi-gigabyte docker save
  # and load of the OpenFOAM layer. They share a runner because they share a docker daemon.

  release:
    name: Validate and publish the release artifact
    needs: [target, await-ci]
    # `needs` alone is not enough. await-ci exits 0 when it decides this commit was SUPERSEDED, so
    # that a merge landing behind another does not report a rejection that never happened - and a
    # green stand-down must still not publish. Stated once, HERE: every job below reaches main
    # through this one, and a skipped dependency skips its dependents, so repeating the condition
    # further down would only be a second place to forget to change it.
    if: needs.await-ci.outputs.proceed == 'true'
    # THE HEAVY LANE, and the only one left in this workflow that deserves the label: this is the
    # job that builds four container images and runs the five-engine native terminal matrix
    # against real Postgres/Redis/MinIO. A 2-core / 14 GB standard runner is what made this carry
    # a "reclaim runner disk" step before it could build at all. `vars.HEXERA_RUNNER_HEAVY` is the
    # label of a larger runner; UNSET IT AND THIS FALLS BACK to the standard image, so the
    # workflow is valid either way and no job can ever queue forever against a label nobody
    # created.
    #
    # UNSET TODAY, and not by oversight. Checked 2026-09-04 with an admin:org token: every
    # `/orgs/hexera-core/actions/hosted-runners` call - list, machine-sizes, and a real create -
    # returns `404 GitHub hosted runners are not supported for this organization`. That is the
    # feature being unavailable to the org, not a permission error (every other org-admin
    # endpoint returned a clean 403 naming the missing scope). Enabling it is an enterprise
    # billing change; when it lands, set the variable and nothing here changes.
    runs-on: ${{ vars.HEXERA_RUNNER_HEAVY || 'ubuntu-latest' }}
    # id-token because release-publish authenticates to Artifact Registry by federation, the same
    # way provision authenticates to everything else: no key file, nothing to rotate.
    permissions:
      contents: read
      id-token: write
    # NO `environment:` HERE, and that is a decision rather than an omission. GitHub prompts an
    # environment's required reviewers ONCE PER JOB, so naming `prod` on both this job and
    # provision would make one release ask for two approvals - the same human, twice, for one
    # decision. The gate sits on provision, which is the job that mutates anything that serves
    # traffic. What this job does before that approval is push immutable digests into
    # hexera-prod's Artifact Registry: bytes that no service references and that promote-release.sh
    # is the only thing that can point a revision at. Approval still stands between the pushed
    # bytes and anything running them.
    #
    # THE TRADE, STATED: prod's Artifact Registry receives objects, and prod's WIF provider is
    # exercised, before a reviewer clicks. If that is ever judged too much, the fix is to name the
    # environment here TOO and accept the second prompt - not to move the gate off provision.
    #
    # Artifact validation builds the app, mesh, console and admin images AND runs the five-engine
    # native terminal matrix. It is measured in tens of minutes, not minutes.
    timeout-minutes: 240
    env:
      # publish.sh derives its registry from RELEASE_REGISTRY when it is set (it is, at the step
      # below) and from these three otherwise. Both routes are pinned so neither can fall back to
      # a value discovered off an env file that does not exist on a fresh runner.
      GCP_PROJECT_ID: ${{ needs.target.outputs.project }}
      GCP_REGION: ${{ needs.target.outputs.region }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ needs.target.outputs.ar_repository }}
    steps:
      # Gate C refuses a dirty tree, identifies the artifact by commit, and adds a git worktree at
      # that exact commit to stage the native fixtures. Full history so the worktree and the
      # record's commit/tree assertions have everything they name.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          # The release authenticates to Google by federation, never to GitHub by token; leaving
          # the checkout credential in .git/config would outlive the step that needed it.
          persist-credentials: false

      # A stock runner has ~14 GB free; the mesh image alone (OpenFOAM 2412 + vmtk + gmsh) is
      # several of them, and Gate C builds the app image beside it. These four toolchains are
      # preinstalled on the image and are used by nothing in this repository.
      - name: Reclaim runner disk for the image builds
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          # NO pip cache here, deliberately. This job builds and publishes the release artifacts,
          # and a cache is writable by workflows that run on untrusted pull requests - restoring
          # one into the publishing path is how poisoned bytes reach a registry. A deploy runs
          # once per release; the seconds a cache saves are not worth that.
      # The same single pinned environment ci.yml installs. Gate C runs the UI suite on the host
      # against the containerised app image, so the host needs the test dependencies; no version
      # is named here, for the same reason ci.yml names none.
      #
      # THIS INSTALL IS WHY provision IS A SEPARATE JOB AND NOT JUST A SEPARATE STEP: pyvista and
      # the rest of dev.txt are minutes of wheels that deploy.sh has no use for. Every script under
      # deploy/gcp/scripts uses a bare `python3` and the standard library, so provision runs on the
      # runner's own interpreter with nothing installed into it.
      - run: pip install -c requirements/constraints.txt -r requirements/runtime.txt -r requirements/dev.txt
      - name: Install the meshpipeline distribution (editable)
        run: pip install -e . --no-deps

      # WORKLOAD IDENTITY FEDERATION. No `credentials_json`, no key file, no long-lived secret:
      # the provider below only accepts tokens whose `repository` claim is this repository, and
      # the service account only accepts impersonation from that same principal set.
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ needs.target.outputs.wif_provider }}
          service_account: ${{ needs.target.outputs.deployer_sa }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

      # release-publish pushes with `docker push`, which needs the credential helper for this
      # registry host. create-artifact-registry.sh configures it too, but that runs INSIDE the
      # deploy - a whole job later, after publication - so the helper has to exist before Gate C's
      # push, not after.
      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      # GATE C, part 1. Builds the deployable images ONCE from this commit and validates THOSE
      # artifacts - wheel provenance, both app entrypoints, the mesh toolchain, the vendored
      # browser assets, the UI in a real browser, and the five-engine native terminal matrix.
      # RELEASE_PYTHON is the interpreter set up above: the gate otherwise falls through to the
      # repository virtualenv (absent here) and then to whatever python3 the host resolves to.
      - name: Validate the release artifact (build the images once, test those exact bytes)
        env:
          RELEASE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: make release-validate

      # ARTIFACT VALIDATION, part 2. Pushes the exact image objects just validated - never a rebuild -
      # and folds the immutable registry digest each push produced into deploy/output/release.json.
      # The registry is pinned rather than discovered: discovery writes deploy/gcp/generated.env,
      # which does not exist yet on a fresh runner (the provision job below is what creates it).
      - name: Publish the validated images (push, then record their immutable digests)
        env:
          RELEASE_PYTHON: ${{ steps.python.outputs.python-path }}
          RELEASE_REGISTRY: ${{ needs.target.outputs.registry }}
        run: make release-publish

      # THE HANDOFF. deploy.sh promotes by digest and builds nothing, so this one file is the
      # entire contract between the two jobs - not the images, which stay on this runner and die
      # with it. `if: always()` because Gate C writes a record with verdict=failed or
      # verdict=incomplete too, and that record is the evidence of WHAT failed; losing it on the
      # runs that need it most is how "the deploy went red" becomes an archaeology exercise.
      - name: Publish the release record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-record-${{ needs.target.outputs.environment }}-${{ github.sha }}
          path: deploy/output/release.json
          if-no-files-found: warn
          retention-days: 90

  provision:
    name: Provision ${{ needs.target.outputs.environment }}
    needs: [target, await-ci, release]
    # NO `if:` - and that is the point of the chain. release carries the proceed check, and a job
    # whose dependency was skipped is skipped, so a stand-down propagates here without a second
    # copy of the condition to keep in step with the first.
    #
    # A STANDARD RUNNER, not the heavy one. This job builds nothing and tests nothing: it reads a
    # JSON record, talks to gcloud, and waits on Google. The heavy label exists for image builds.
    runs-on: ubuntu-latest
    # id-token lives here and in release, and nowhere else: these are the only jobs that exchange
    # an OIDC token for Google credentials, and a workflow-wide grant would let the target-selection
    # job mint one too.
    permissions:
      contents: read
      id-token: write
    # THE GATE. The GitHub environment is what carries the protection rules: `dev` is
    # branch-restricted to main and deploys without approval; `prod` is where the required
    # reviewers live. Naming it HERE, on the one job that mutates anything that serves traffic, is
    # what makes a release wait for them - and naming it here ONLY is what keeps that to one
    # prompt. See the note on release above for what happens before this line is reached.
    environment:
      name: ${{ needs.target.outputs.environment }}
    # deploy.sh waits on Google - a Cloud SQL instance that has to be created is tens of minutes on
    # its own - but it neither builds nor tests. The old 300 was sized for Gate C, which now lives
    # a job away.
    timeout-minutes: 120
    outputs:
      # WHAT deploy.sh DISCOVERED, promoted from step outputs to job outputs so the three jobs
      # below can branch on them. Each one is written by the script that owns that tier and is
      # EMPTY when the tier was not reconciled, which is what makes `!= ''` a real condition
      # rather than a guess about whether a component was selected.
      edge_ip: ${{ steps.deploy.outputs.edge_ip }}
      edge_cert_state: ${{ steps.deploy.outputs.edge_cert_state }}
      console_url: ${{ steps.deploy.outputs.console_url }}
      admin_url: ${{ steps.deploy.outputs.admin_url }}
    env:
      # The pinned deployment targets, exported for the whole job because discovery
      # (deploy/gcp/scripts/bootstrap-env.sh) reads them from the environment and DEPLOY_NONINTERACTIVE
      # refuses to proceed without all four.
      GCP_PROJECT_ID: ${{ needs.target.outputs.project }}
      GCP_REGION: ${{ needs.target.outputs.region }}
      CLOUDRUN_MESH_JOB: ${{ needs.target.outputs.mesh_job }}
      GCP_MESH_BUCKET: ${{ needs.target.outputs.mesh_bucket }}
      # Not required by the non-interactive guard, but pinned for the same reason: left to their
      # defaults they are derived from the project id, and the live resources carry
      # deployment-id=dev labels that a derived `hexera-dev` would silently rewrite.
      DEPLOYMENT_ID: ${{ needs.target.outputs.deployment_id }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ needs.target.outputs.ar_repository }}
      # THE PUBLIC SURFACE. Without this the deploy provisioned every tier except the one users
      # reach, and the API service stayed whatever a human last clicked into existence.
      CLOUDRUN_API_SERVICE: ${{ needs.target.outputs.api_service }}
      # THE CONSOLE, pinned in both environments now. See the `console_service` output above for
      # why prod was empty until now and what changed. bootstrap-env.sh's CLOUDRUN_CONSOLE_SERVICE
      # carries this straight through; an unset value there is what makes the console stage state
      # its own skip, and that path is now only reachable if this output is ever unpinned again.
      CLOUDRUN_CONSOLE_SERVICE: ${{ needs.target.outputs.console_service }}
      # THE ADMIN CONSOLE, pinned in both environments now, same as CLOUDRUN_CONSOLE_SERVICE
      # above. bootstrap-env.sh's CLOUDRUN_ADMIN_SERVICE carries this straight through.
      CLOUDRUN_ADMIN_SERVICE: ${{ needs.target.outputs.admin_service }}
      # THE CUSTOM HOSTNAMES, pinned in both environments now, same as CLOUDRUN_CONSOLE_SERVICE
      # and CLOUDRUN_ADMIN_SERVICE above. create-edge.sh sees both CONSOLE_DOMAIN and ADMIN_DOMAIN
      # set and provisions the load balancer, address and certificate they front.
      CONSOLE_DOMAIN: ${{ needs.target.outputs.console_domain }}
      ADMIN_DOMAIN: ${{ needs.target.outputs.admin_domain }}
      BILLING_EXPORT_TABLE: ${{ needs.target.outputs.billing_export_table }}
      WORKER_ENV_URI: ${{ needs.target.outputs.worker_env_uri }}
      OUTREACH_ENABLED: ${{ needs.target.outputs.outreach_enabled }}
      OUTREACH_WORKER_JOB: ${{ needs.target.outputs.outreach_worker_job }}
      OUTREACH_DB_HOST: ${{ needs.target.outputs.outreach_db_host }}
      OUTREACH_DB_NAME: ${{ needs.target.outputs.outreach_db_name }}
      OUTREACH_DB_USER: ${{ needs.target.outputs.outreach_db_user }}
      OUTREACH_CLOUDSQL_INSTANCE: ${{ needs.target.outputs.outreach_cloudsql_instance }}
      OUTREACH_DB_PASSWORD_SECRET: ${{ needs.target.outputs.outreach_db_password_secret }}
      OUTREACH_KMS_KEY: ${{ needs.target.outputs.outreach_kms_key }}
      GOOGLE_CLIENT_ID: ${{ needs.target.outputs.google_client_id }}
      GOOGLE_CLIENT_SECRET_SECRET: ${{ needs.target.outputs.google_client_secret_secret }}
      GOOGLE_REDIRECT_URI: ${{ needs.target.outputs.google_redirect_uri }}
      # THE RUNTIME HARDENING, carried the same way CLOUDRUN_CONSOLE_SERVICE above is: pinned by
      # the picker, exported here for the whole job, read out of the ambient environment by
      # bootstrap-env.sh's generated-env heredoc, and handed to create-api-service.sh as ENV and
      # CORS_ORIGINS on the service. This is the ONLY path by which either value reaches the API:
      # stage 1 regenerates the deployment env from that heredoc, so anything written into that
      # file by another route is gone before stage 2 reads it.
      APP_ENV: ${{ needs.target.outputs.app_env }}
      API_CORS_ORIGINS: ${{ needs.target.outputs.api_cors_origins }}
      # THE DATA TIER, BY NAME. create-data-tier.sh reconciles these two instances and writes
      # their resolved PRIVATE addresses back into the deployment env, so MIGRATE_DB_HOST and
      # REDIS_URL are outputs of this run rather than literals that go stale in this file.
      CLOUDSQL_INSTANCE: ${{ needs.target.outputs.cloudsql_instance }}
      REDIS_INSTANCE: ${{ needs.target.outputs.redis_instance }}
      # THE SCHEMA STEP. Migrations run once, from the deploy, against the promoted application
      # digest - before anything serves it. The API container still migrates itself under an
      # advisory lock, and that stays as the safety net, but a deploy no longer depends on N
      # cold-starting instances racing for a lock on a service that is already public.
      MIGRATE_DB_NAME: ${{ needs.target.outputs.migrate_db_name }}
      MIGRATE_DB_USER: ${{ needs.target.outputs.migrate_db_user }}
      POSTGRES_PASSWORD_SECRET: ${{ needs.target.outputs.postgres_password_secret }}
      # THE FLEET'S SCALING SIGNAL. Published by one scheduled job off the fleet, so a group at
      # zero instances can still be woken (platform-buildout-plan.md, Decisions 4).
      WORKER_MIG: ${{ needs.target.outputs.worker_mig }}
      WORKER_MIG_ZONE: ${{ needs.target.outputs.worker_mig_zone }}
      # THE OBJECT-STORE KEY, carried exactly the way APP_ENV above is: pinned by the picker,
      # exported for the whole job, and picked up out of the ambient environment by
      # bootstrap-env.sh's generated-env heredoc on stage 1. That heredoc is why this route is
      # the only one that works - it rewrites the deployment env before stage 2 reads it, so a
      # value committed to deploy/gcp/generated.prod.env (which records this same access id) is
      # erased before create-object-storage.sh could ever see it. NO SECRET VALUE: the access id
      # is the public half, and MINIO_SECRET_KEY_SECRET is a Secret Manager container name.
      MINIO_ACCESS_KEY: ${{ needs.target.outputs.minio_access_key }}
      MINIO_BUCKET: ${{ needs.target.outputs.minio_bucket }}
      MINIO_SECRET_KEY_SECRET: ${{ needs.target.outputs.minio_secret_key_secret }}
    steps:
      # A SHALLOW CHECKOUT IS ENOUGH HERE, unlike release's. Nothing in this job reads history:
      # lib.sh derives the image tag from `rev-parse --short=12 HEAD` plus a `diff --quiet HEAD`
      # dirty check, and promote-release.sh compares that same HEAD against the commit recorded in
      # release.json - all of which a depth-1 clone answers. It refuses to deploy a record built
      # from a different commit, which is the assertion that makes handing the record across a job
      # boundary safe.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      # envsubst (gettext-base) is a hard requirement of deploy.sh - it stops with one instruction
      # without it, three stages in. Installed up front so the run fails on the runner image, not
      # on the deploy.
      - name: Install the deploy driver's host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext-base

      # THE ARTIFACT release BUILT AND PUSHED, by digest. promote-release.sh reads exactly this
      # file and refuses a record that is not state=published/verdict=passed, or whose commit is
      # not this HEAD - so a download that silently produced the wrong bytes stops the deploy
      # rather than shipping them.
      - name: Fetch the release record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-record-${{ needs.target.outputs.environment }}-${{ github.sha }}
          path: deploy/output

      # WORKLOAD IDENTITY FEDERATION, the same exchange release performs and for the same reason:
      # the provider only accepts tokens whose `repository` claim is this repository, and the
      # service account only accepts impersonation from that principal set. Two jobs mean two
      # short-lived tokens, which is strictly better than one long-lived anything.
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ needs.target.outputs.wif_provider }}
          service_account: ${{ needs.target.outputs.deployer_sa }}
      # deploy.sh is a gcloud program; the auth step above only produces the credentials it uses.
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

      # THE ONLY CLOUD MUTATION IN THIS WORKFLOW. deploy.sh is interactive by default - it prints a
      # plan and makes the operator type the project id - and DEPLOY_NONINTERACTIVE=1 is its
      # documented automation path, which then requires every ambiguous target pinned explicitly
      # (the four exported at job level). It promotes the digest release-publish recorded; it
      # never builds.
      #
      # MESH_INVOKER is deliberately unset: the invoker binding names the principal that SUBMITS
      # mesh jobs, which is the application's runtime identity, not this deployer. Setting it here
      # would grant the CI identity a standing right to execute jobs it only exists to provision.
      - name: Provision the deployment (deploy/gcp/scripts/deploy.sh, non-interactive)
        id: deploy
        env:
          DEPLOY_NONINTERACTIVE: "1"
          DEPLOY_COMPONENTS: ${{ needs.target.outputs.components }}
          # THE CONSOLE'S IDENTITY PLATFORM CONFIG. `vars` here resolves against the GitHub
          # ENVIRONMENT this job runs under, so dev reads hexera-dev's values and prod reads
          # hexera-506114's without either naming the other - the same per-environment split the
          # project and region already get from the target job. This is also the reason the
          # environment is named on THIS job and not on release: these values do not exist outside
          # it. Deliberately variables and not secrets: the web API key identifies the project and
          # authorises nothing on its own, it ships inside the browser bundle, and pretending
          # otherwise would only hide it from the people who need to read it. What gates signup is
          # CONSOLE_SIGNUP_ENABLED on the API.
          #
          # An empty value here is not silent: validate-config.sh refuses a run whose components
          # include the console while any of the three is unset, because a console that deploys
          # without them tells every visitor sign-in is not configured.
          # A DELIBERATE, PER-RUN OPT-IN, never a standing setting. create-console-service.sh
          # refuses to drop a setting that exists on the live service but not in this
          # deployment, because the service's environment is declarative and the next revision
          # would silently lose it. Retiring CONSOLE_AUTH_USERS is exactly that drop and is
          # intended - once. Pinning this to "1" in the file would retire the guard along with
          # the setting, so it stays a checkbox that defaults OFF like every tier above.
          # THE BROWSER TALKS TO THE API DIRECTLY - client-config on page load, and the
          # WebSocket stream, neither of which passes through the console's proxy - so a browser
          # can never present a Google identity token and the service cannot be invoker-private
          # while the console works. This is the dev concession the build-out plan already
          # records, and it is NOT the whole gate: MESH_API_KEY and USER_TOKEN_SECRET are both
          # set on dev-api, so a caller past Cloud Run still needs the key and an HMAC-signed
          # X-User-Sig. Set per environment, so prod chooses for itself rather than inheriting.
          API_ALLOW_UNAUTHENTICATED: ${{ vars.API_ALLOW_UNAUTHENTICATED }}
          CONSOLE_ENV_PRUNE: ${{ inputs.console_env_prune && '1' || '' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        run: bash deploy/gcp/scripts/deploy.sh

      # The record that says what is actually deployed, kept as a build output. Gitignored machine
      # state, and the live drift it exists to prevent is already documented: deployment.json names
      # one mesh digest while the job runs another. release.json travels beside it because the two
      # are only meaningful together - what was validated, and what that turned into.
      - name: Publish the deployment record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: deploy-records-${{ needs.target.outputs.environment }}-${{ github.sha }}
          path: |
            deploy/output/release.json
            deploy/output/deployment.json
          if-no-files-found: warn
          retention-days: 90

  # THE ADDRESS AN OPERATOR MUST PUT IN DNS, surfaced where they will see it. Its own job because
  # it is the one thing here a human is meant to ACT on, and burying it under a 40-minute deploy
  # log is how it gets missed - as a row it is either there or it is not.
  #
  # create-edge.sh (Task 4) writes edge_ip and edge_cert_state to $GITHUB_OUTPUT only when the edge
  # stage ran and declared at least one hostname; this job runs on exactly that condition, so a
  # deploy whose components never touched the edge leaves it skipped rather than printing an empty
  # table. Both environments now pin CONSOLE_DOMAIN/ADMIN_DOMAIN, so a release tag's first run is
  # expected to print this table - with the certificate reporting PROVISIONING until DNS is pointed
  # at the address it prints.
  edge-dns:
    name: Edge address for DNS
    needs: [target, provision]
    if: needs.provision.outputs.edge_ip != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Surface the edge address for DNS
        env:
          EDGE_IP: ${{ needs.provision.outputs.edge_ip }}
          EDGE_CERT_STATE: ${{ needs.provision.outputs.edge_cert_state }}
          CONSOLE_DOMAIN: ${{ needs.target.outputs.console_domain }}
          ADMIN_DOMAIN: ${{ needs.target.outputs.admin_domain }}
        run: |
          set -euo pipefail
          {
            # edge_cert_state carries one `hostname=STATE` per declared hostname, so the state
            # belongs in the row for that hostname rather than mashed into one line under the
            # table -- with per-host certificates the two hostnames reach ACTIVE separately, and
            # the whole point of reading this table is to see WHICH one is not there yet.
            _state_of() {
              for _pair in ${EDGE_CERT_STATE}; do
                case "${_pair}" in "$1="*) printf '%s' "${_pair#*=}"; return ;; esac
              done
              printf 'unknown'
            }
            echo "## Edge"
            echo
            echo "| Hostname | Record | Value | Certificate |"
            echo "|---|---|---|---|"
            [ -n "${CONSOLE_DOMAIN}" ] && echo "| \`${CONSOLE_DOMAIN}\` | A | \`${EDGE_IP}\` | $(_state_of "${CONSOLE_DOMAIN}") |"
            [ -n "${ADMIN_DOMAIN}" ] && echo "| \`${ADMIN_DOMAIN}\` | A | \`${EDGE_IP}\` | $(_state_of "${ADMIN_DOMAIN}") |"
            echo
            echo "TTL 300 on each A record. \`PROVISIONING\` becomes \`ACTIVE\` on its own, 15-60 min after the record propagates."
          } >> "$GITHUB_STEP_SUMMARY"

  # POST-DEPLOY VERIFICATION (design spec docs/superpowers/specs/2026-09-07-saas-console-design.md
  # §4): an HTTP check against the console's own URL, the one thing nothing before this ever proves
  # against a REAL deployed revision - Gate C's console smoke only proves the image can serve
  # /api/internal/health in isolation, with no Auth.js, no live API origin and no Cloud Run front
  # end in the loop.
  #
  # ITS OWN JOB, AND NO CREDENTIALS. Every request below is unauthenticated by design, so this
  # needs neither the OIDC exchange nor gcloud nor a checkout - four curls against a public URL.
  # It ran back-to-back with the admin check for no reason other than step order; the two share
  # nothing and now run at the same time.
  #
  # RUNS ONLY WHEN THE CONSOLE WAS ACTUALLY RECONCILED. create-console-service.sh is the one
  # place that already resolves the deployed URL (it logs it too), so it writes console_url to
  # $GITHUB_OUTPUT itself rather than this job re-deriving it - and it does so from the one line
  # unreachable from its own "no console configured" skip, so a deploy that never touched the
  # console (components without 'console', or a target with no CLOUDRUN_CONSOLE_SERVICE pinned)
  # leaves this condition false and the job does not run.
  #
  # FOUR ASSERTIONS, unauthenticated (no session cookie is presented anywhere below):
  #   1. GET /                    -> a redirect to /sign-in (Auth.js's own gate, exercised for
  #                                  real)
  #   2. GET /sign-in             -> 200, AND the /_next/static assets the rendered page
  #                                  references also 200 - weak "200 on /sign-in alone" would
  #                                  miss a broken .next/static or public/ path, which no smoke
  #                                  has ever covered
  #   3. GET /api/internal/health -> 200 with a JSON body whose status is "ok" - the same
  #                                  unauthenticated route Gate C's in-container smoke already
  #                                  curls, so post-deploy and build-time verification agree on
  #                                  one endpoint instead of two
  #   4. GET /readyz              -> 401 unauthenticated. /readyz is deliberately session-gated
  #                                  - it proxies to the product API presenting MESH_API_KEY -
  #                                  so a 200 here would mean any caller of this
  #                                  allUsers-invokable service could spend the console's own
  #                                  API key against the product API. 401 is the passing case:
  #                                  it proves the session gate is actually live on the
  #                                  deployed revision, which a 200-only check never would.
  verify-console:
    name: Verify the deployed console
    needs: [provision]
    if: needs.provision.outputs.console_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: / redirects, /sign-in renders, /api/internal/health 200, /readyz 401
        env:
          CONSOLE_URL: ${{ needs.provision.outputs.console_url }}
        run: |
          set -euo pipefail
          echo "verifying ${CONSOLE_URL}"

          # 1) unauthenticated / redirects to /sign-in. A few retries: the revision was reported
          #    ready by `gcloud run deploy`, but the very first request can still race a cold
          #    start behind Cloud Run's own load balancer.
          ok=0
          for _try in 1 2 3 4 5; do
            read -r code location < <(curl -s -o /dev/null --max-time 10 \
              -w $'%{http_code} %{redirect_url}\n' "${CONSOLE_URL}/")
            case "${code}" in
              301|302|303|307|308)
                case "${location}" in
                  */sign-in|*/sign-in\?*) ok=1 ;;
                esac
                ;;
            esac
            [ "${ok}" = "1" ] && break
            sleep 3
          done
          if [ "${ok}" != "1" ]; then
            echo "::error::unauthenticated GET / did not redirect to /sign-in (last saw: ${code:-?} -> ${location:-<none>})"
            exit 1
          fi
          echo "OK: / -> ${location}"

          # 2) the sign-in page renders - strong enough to notice a broken asset path. Fetching it
          #    alone proves nothing about .next/static or public/; actually fetching the assets it
          #    references does.
          code="$(curl -s -o /tmp/console-verify-signin.html --max-time 10 -w '%{http_code}' \
            "${CONSOLE_URL}/sign-in")"
          [ "${code}" = "200" ] || { echo "::error::GET /sign-in returned ${code}, not 200"; exit 1; }
          grep -qi '<html' /tmp/console-verify-signin.html \
            || { echo "::error::/sign-in did not render HTML"; exit 1; }
          # Next.js embeds asset paths JSON-escaped inside <script> payloads too
          # (\"/_next/static/chunks/foo.js\"), so a class that only excludes `"` also swallows
          # the backslash immediately before the closing quote, producing a path ending in `\`
          # that a real server answers with a redirect rather than 200. Exclude the backslash,
          # angle brackets and whitespace too, so the match stops at the true end of the path
          # wherever it sits (quoted attribute, escaped JSON string, or bare in a script body).
          assets="$(grep -oE '/_next/static/[^"\\<>[:space:]]+' /tmp/console-verify-signin.html | sort -u | head -5)"
          if [ -z "${assets}" ]; then
            echo "::error::/sign-in referenced no /_next/static assets - cannot confirm the asset path works"
            exit 1
          fi
          while IFS= read -r asset; do
            [ -n "${asset}" ] || continue
            acode="$(curl -s -o /dev/null --max-time 10 -w '%{http_code}' "${CONSOLE_URL}${asset}")"
            [ "${acode}" = "200" ] || { echo "::error::asset ${asset} returned ${acode}, not 200"; exit 1; }
          done <<<"${assets}"
          echo "OK: /sign-in rendered, $(printf '%s\n' "${assets}" | grep -c .) static asset(s) served"

          # 3) /api/internal/health returns 200 with a JSON body whose status is "ok". This route
          #    is unauthenticated by design and is already what Gate C's in-container smoke curls,
          #    so post-deploy and build-time verification agree on one endpoint.
          hcode="$(curl -s -o /tmp/console-verify-health.json --max-time 10 -w '%{http_code}' \
            "${CONSOLE_URL}/api/internal/health")"
          [ "${hcode}" = "200" ] || { echo "::error::GET /api/internal/health returned ${hcode}, not 200"; exit 1; }
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/console-verify-health.json \
            || { echo "::error::/api/internal/health did not report status ok: $(cat /tmp/console-verify-health.json)"; exit 1; }
          echo "OK: /api/internal/health 200, status ok"

          # 4) /readyz returns 401 unauthenticated. /readyz is not a liveness probe: it requires a
          #    session and then proxies to the product API presenting MESH_API_KEY, so a 200 here
          #    unauthenticated would let any caller of this allUsers-invokable service spend the
          #    console's own API key against the product API. 401 is the passing case - it proves
          #    the session gate is actually live on the deployed revision.
          rcode="$(curl -s -o /dev/null --max-time 10 -w '%{http_code}' "${CONSOLE_URL}/readyz")"
          [ "${rcode}" = "401" ] || { echo "::error::GET /readyz returned ${rcode}, not 401 - the session gate may not be enforced on this revision"; exit 1; }
          echo "OK: /readyz 401 (session gate enforced)"

  # THE ONE CHECK THAT MATTERS. IAP over a service that still carries an allUsers invoker binding
  # protects nothing - the two are separate gates - and the symptom is silence, because the page
  # loads and looks fine. Asserted here rather than left to a runbook.
  #
  # ITS OWN JOB, in parallel with verify-console, because the two share nothing but the deploy that
  # preceded them. This one DOES need credentials - it reads the live invoker policy - so it
  # performs its own federated exchange; that is a second short-lived token, not a longer-lived one.
  # It does NOT name the environment: it reads a target the picker already resolved, so making a
  # reviewer approve it a second time would gate a read-only assertion behind a human.
  verify-admin:
    name: Verify the admin console is private
    needs: [target, provision]
    if: needs.provision.outputs.admin_url != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ needs.target.outputs.wif_provider }}
          service_account: ${{ needs.target.outputs.deployer_sa }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      - name: No anonymous 200, and no public invoker binding
        env:
          ADMIN_URL: ${{ needs.provision.outputs.admin_url }}
          ADMIN_SERVICE: ${{ needs.target.outputs.admin_service }}
          REGION: ${{ needs.target.outputs.region }}
          PROJECT: ${{ needs.target.outputs.project }}
        run: |
          set -euo pipefail
          if ! code="$(curl -s -o /dev/null --max-time 15 -w '%{http_code}' "${ADMIN_URL}/")"; then
            echo "::error::curl could not reach ${ADMIN_URL}/ - cannot verify the admin console is not publicly reachable"
            exit 1
          fi
          case "${code}" in
            200)
              echo "::error::an anonymous request to ${ADMIN_URL}/ returned 200 - the admin console is publicly reachable"
              exit 1 ;;
            *)
              echo "OK: anonymous request refused (${code})" ;;
          esac
          if ! members_raw="$(gcloud run services get-iam-policy "${ADMIN_SERVICE}" \
            --project "${PROJECT}" --region "${REGION}" \
            --format='value(bindings.members)' 2>&1)"; then
            echo "::error::could not read the invoker policy for ${ADMIN_SERVICE} in ${PROJECT}/${REGION} - refusing to report success on the one check that matters when it could not actually run: ${members_raw}"
            exit 1
          fi
          members="$(printf '%s' "${members_raw}" | tr ';' '\n')"
          if [ -z "$(printf '%s' "${members}" | tr -d '[:space:]')" ]; then
            echo "::error::the invoker policy for ${ADMIN_SERVICE} came back with no members at all - a working admin service always carries the IAP service agent's own invoker binding, so an empty read is evidence this check did not run, not evidence the service is private"
            exit 1
          fi
          if printf '%s\n' "${members}" | grep -qxE 'allUsers|allAuthenticatedUsers'; then
            echo "::error::${ADMIN_SERVICE} carries a public invoker binding (allUsers or allAuthenticatedUsers) - IAP is not protecting it"
            exit 1
          fi
          echo "OK: no public invoker binding"

  # THE AGGREGATE, the same shape ci.yml's ci-gate has and for the same reason: splitting one job
  # into seven means seven rows somebody would otherwise have to read individually to answer "did
  # the deploy work". This is the one row that answers it, and a new job joins it by being added to
  # `needs` and to the list below - not by anyone editing a branch protection rule.
  deploy-gate:
    name: hexera/deploy-gate
    needs:
      - target
      - await-ci
      - release
      - provision
      - edge-dns
      - verify-console
      - verify-admin
    # `always()` would also fire for a run the concurrency group cancelled. `!cancelled()` still
    # runs the gate when a job genuinely fails, which is the entire point of it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every deploy job
        env:
          # These two decide whether anything ships, so neither may be anything but green.
          REQUIRED_RESULTS: |
            target=${{ needs.target.result }}
            await-ci=${{ needs.await-ci.result }}
          # SKIPPED IS A LEGITIMATE OUTCOME for every one of these, and each for its own reason:
          # release and provision skip when await-ci stood the run down as superseded, and the
          # three post-deploy jobs skip when the tier they check was not part of this run's
          # components. `failure` is never legitimate for any of them.
          SELECTED_RESULTS: |
            release=${{ needs.release.result }}
            provision=${{ needs.provision.result }}
            edge-dns=${{ needs.edge-dns.result }}
            verify-console=${{ needs.verify-console.result }}
            verify-admin=${{ needs.verify-admin.result }}
        run: |
          set -euo pipefail
          failures=0
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            name="${entry%%=*}"; result="${entry#*=}"
            echo "${name}: ${result}"
            if [ "$result" != "success" ]; then
              echo "::error title=Required deploy job did not succeed::${name} finished with ${result}"
              failures=1
            fi
          done <<< "$REQUIRED_RESULTS"
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            name="${entry%%=*}"; result="${entry#*=}"
            echo "${name}: ${result}"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error title=Deploy job did not succeed::${name} finished with ${result}"
                failures=1
                ;;
            esac
          done <<< "$SELECTED_RESULTS"
          exit "$failures"
